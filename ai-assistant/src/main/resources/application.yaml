server:
  port: 3180

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Dingtong1998
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    # 智谱 GLM 官方 Starter（spring-ai-starter-model-zhipuai）
    # 官方模块自带 base-url=https://open.bigmodel.cn/api/paas（无需配置），
    # 并将智谱扩展字段 reasoning_content 映射为消息的思考内容（流式逐块可读）。
    zhipuai:
      api-key: ${API_MODEL_KEY}
      chat:
        options:
          model: glm-5.3-flash

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:3170

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.assistant.ai.entity
  configuration:
    map-underscore-to-camel-case: true

# LLM API 配置 —— 仅用于日志/展示（打印模型名），真正调用走 spring.ai.zhipuai.*
llm:
  api-key: ${API_MODEL_KEY}
  base-url: https://open.bigmodel.cn/api/paas
  model: glm-5.3-flash
  timeout: 60

# MCP 客户端配置
mcp:
  server:
    url: http://localhost:3190/mcp
    enabled: true
    token-url: http://localhost:3170/oauth2/token
    client-id: ai-assistant
    client-secret: ${MCP_CLIENT_SECRET:ai-assistant-secret}
    scope: mcp.weather